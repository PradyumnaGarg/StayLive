<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..800&family=Geist+Mono:wght@500&family=Instrument+Serif:ital@0;1&display=block" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#efe9dc;color:#0f1b15;font-family:Geist,sans-serif}
.wrap{position:relative;width:1200px;height:630px;padding:56px 60px;box-sizing:border-box}
.brand{display:flex;align-items:center;gap:14px;font-weight:600;font-size:30px;letter-spacing:-.02em}
.brand img{width:52px;height:52px;border-radius:12px}
h1{margin:44px 0 0;font-weight:600;font-size:118px;line-height:.88;letter-spacing:-.065em;position:relative;z-index:2}
h1 i{font-family:"Instrument Serif",serif;font-weight:400;font-size:1.1em;letter-spacing:-.03em;color:#a86f00}
.tags{position:absolute;left:60px;bottom:52px;display:flex;gap:10px;z-index:2}
.tag{font:500 17px "Geist Mono",monospace;text-transform:uppercase;letter-spacing:.03em;padding:10px 16px;border-radius:999px;border:1.5px solid rgba(15,27,21,.2)}
.tag.hot{background:#f2b53c;border-color:#f2b53c}
.screen{position:absolute;right:-70px;top:150px;width:620px;height:400px;border-radius:26px;overflow:hidden;box-shadow:0 40px 90px -20px rgba(15,27,21,.6)}
.screen canvas{width:100%;height:100%;display:block}
</style></head><body><div class="wrap">
<div class="brand"><img src="../../site/icon.png">StayLive</div>
<h1>Your Mac,<br>finally <i>alive.</i></h1>
<div class="tags"><span class="tag hot">Free forever</span><span class="tag">Open source</span><span class="tag">macOS</span></div>
<div class="screen"><canvas id="c" width="1240" height="800"></canvas></div>
</div><script>
  function rng(seed) {
    let s = seed >>> 0;
    return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  }
  const rgba = (r, g, b, a = 1) => `rgba(${r * 255 | 0},${g * 255 | 0},${b * 255 | 0},${a})`;
  function vgrad(ctx, h, stops) {
    const g = ctx.createLinearGradient(0, 0, 0, h);
    stops.forEach(([o, c]) => g.addColorStop(o, c));
    return g;
  }
  function glow(ctx, x, y, r, c) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, c); g.addColorStop(1, c.replace(/[\d.]+\)$/, '0)'));
    ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }
  const scenes = {
    aurora(ctx, w, h, t) {
      ctx.fillStyle = vgrad(ctx, h, [[0, rgba(0.01, 0.02, 0.07)], [1, rgba(0.02, 0.06, 0.12)]]);
      ctx.fillRect(0, 0, w, h);
      const r = rng(7);
      for (let i = 0; i < 220; i++) {
        const x = r() * w, y = h - (h * 0.35 + r() * h * 0.65), s = (0.6 + r() * 1.6) * (w / 1400);
        ctx.fillStyle = rgba(1, 1, 1, 0.25 + 0.55 * r());
        ctx.beginPath(); ctx.arc(x, y, Math.max(s, 0.5), 0, 7); ctx.fill();
      }
      ctx.globalCompositeOperation = 'lighter';
      const ribbons = [
        [0.66, 0.07, 1.4, 1, [0.15, 0.95, 0.60, 0.05]],
        [0.74, 0.05, 1.1, -1, [0.25, 0.70, 1.00, 0.042]],
        [0.58, 0.04, 2.0, 2, [0.65, 0.35, 1.00, 0.036]],
      ];
      for (const [base, amp, k, speed, c] of ribbons) {
        ctx.fillStyle = rgba(...c);
        for (let layer = 0; layer < 9; layer++) {
          const off = layer * 0.012, steps = 90;
          ctx.beginPath();
          for (let i = 0; i <= steps; i++) {
            const x = i / steps;
            const y = base + off + amp * Math.sin(k * x * 2 * Math.PI + speed * t) + 0.02 * Math.sin(5 * x * Math.PI + 2 * t);
            i ? ctx.lineTo(x * w, h - y * h) : ctx.moveTo(x * w, h - y * h);
          }
          for (let i = steps; i >= 0; i--) {
            const x = i / steps;
            const y = base - 0.16 + off * 0.5 + amp * Math.sin(k * x * 2 * Math.PI + speed * t);
            ctx.lineTo(x * w, h - y * h);
          }
          ctx.fill();
        }
      }
      ctx.globalCompositeOperation = 'source-over';
    },
    colorFlow(ctx, w, h, t) {
      ctx.fillStyle = vgrad(ctx, h, [[0, rgba(0.05, 0.03, 0.10)], [1, rgba(0.02, 0.02, 0.05)]]);
      ctx.fillRect(0, 0, w, h);
      ctx.globalCompositeOperation = 'lighter';
      const blobs = [
        [1, 2, 0.0, 'rgba(255,77,140,0.55)'], [2, 1, 1.3, 'rgba(115,89,255,0.55)'],
        [1, 1, 2.6, 'rgba(255,153,64,0.45)'], [3, 2, 3.9, 'rgba(51,179,255,0.45)'],
        [2, 3, 5.0, 'rgba(217,77,255,0.40)'],
      ];
      for (const [a, b, p, c] of blobs) {
        glow(ctx, w * (0.5 + 0.32 * Math.sin(a * t + p)), h * (0.5 + 0.30 * Math.cos(b * t + p * 0.7)), h * 0.75, c);
      }
      ctx.globalCompositeOperation = 'source-over';
    },
    starfield(ctx, w, h, t) {
      ctx.fillStyle = vgrad(ctx, h, [[0, rgba(0.03, 0.01, 0.08)], [1, rgba(0.02, 0.02, 0.06)]]);
      ctx.fillRect(0, 0, w, h);
      ctx.globalCompositeOperation = 'lighter';
      glow(ctx, w * (0.3 + 0.05 * Math.sin(t)), h * 0.4, h * 0.7, 'rgba(89,38,153,0.35)');
      glow(ctx, w * (0.75 + 0.05 * Math.cos(t)), h * 0.65, h * 0.6, 'rgba(26,77,153,0.3)');
      const r = rng(42), scale = w / 1400;
      for (let i = 0; i < 380; i++) {
        const depth = r(), loops = depth > 0.7 ? 2 : 1;
        const x = ((r() + loops * t / (2 * Math.PI)) % 1) * w, y = r() * h;
        const size = (1.4 + depth * 3.2) * scale;
        const tw = 0.55 + 0.45 * Math.sin((Math.floor(r() * 4) + 1) * t + r() * 6.28);
        ctx.fillStyle = rgba(0.85 + 0.15 * depth, 0.92, 1, tw * (0.5 + 0.5 * depth));
        ctx.beginPath(); ctx.arc(x, y, Math.max(size / 2, 0.5), 0, 7); ctx.fill();
      }
      ctx.globalCompositeOperation = 'source-over';
    },
    duskWaves(ctx, w, h, t) {
      ctx.fillStyle = vgrad(ctx, h, [[0, rgba(0.10, 0.08, 0.25)], [0.4, rgba(0.55, 0.25, 0.55)], [0.65, rgba(0.98, 0.55, 0.35)]]);
      ctx.fillRect(0, 0, w, h);
      ctx.globalCompositeOperation = 'lighter';
      glow(ctx, w * 0.5, h * 0.58, h * 0.35, 'rgba(255,191,115,0.55)');
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = rgba(1, 0.85, 0.6, 0.95);
      ctx.beginPath(); ctx.arc(w * 0.5, h * 0.58, h * 0.07, 0, 7); ctx.fill();
      const waves = [
        [0.40, 0.012, 3, 1, [0.30, 0.18, 0.40, 0.9]], [0.33, 0.016, 2, -1, [0.20, 0.12, 0.32, 0.92]],
        [0.25, 0.020, 4, 2, [0.13, 0.08, 0.24, 0.95]], [0.16, 0.024, 3, -2, [0.08, 0.05, 0.16, 0.97]],
        [0.07, 0.028, 2, 1, [0.04, 0.03, 0.10, 1]],
      ];
      for (const [base, amp, k, speed, c] of waves) {
        ctx.fillStyle = rgba(...c);
        ctx.beginPath(); ctx.moveTo(0, h);
        const steps = 120;
        for (let i = 0; i <= steps; i++) {
          const x = i / steps;
          const y = base + amp * Math.sin(k * x * 2 * Math.PI + speed * t) + amp * 0.4 * Math.sin(7 * x * 2 * Math.PI - 2 * speed * t);
          ctx.lineTo(x * w, h - y * h);
        }
        ctx.lineTo(w, h); ctx.fill();
      }
    },
  };


  const c=document.getElementById('c'); scenes.aurora(c.getContext('2d'), c.width, c.height, 2.2);
</script></body></html>
